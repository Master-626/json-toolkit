[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "json-toolkit"
version = "0.1.0"
description = "A powerful JSON processing toolkit - format, minify, validate, query path, convert formats"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }
]
keywords = ["json", "cli", "formatter", "validator", "jsonpath", "converter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0.0",
]

[project.scripts]
json-toolkit = "json_toolkit.cli:main"
jtk = "json_toolkit.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/Master-626/json-toolkit"
Repository = "https://github.com/Master-626/json-toolkit"
Issue-Tracker = "https://github.com/Master-626/json-toolkit/issues"

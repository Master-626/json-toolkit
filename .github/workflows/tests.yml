name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Python 3.8 and 3.9 are published for Ubuntu 22.04, not newer images.
        os: [ubuntu-22.04]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # Bash, including on Windows, so the version markers are not parsed as redirection.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" \
            "build>=1.2,<1.3; python_version < '3.9'" \
            "build>=1.2,<1.5; python_version >= '3.9' and python_version < '3.10'" \
            "build>=1.2; python_version >= '3.10'"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q
      - name: Build
        run: python -m build
